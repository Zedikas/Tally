name: Tally
options:
  bundleIdPrefix: com.samua
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  Tally:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tally
        excludes:
          - RootView.swift
          - Resources/Info.plist
          - Resources/Assets.xcassets
          - Resources/AlternateIcons
      - path: FullSigning/Shared
      - path: FullSigning/App
        excludes:
          - TallyCloudAutoSyncCoordinator.swift
    resources:
      - path: Tally/Resources
    info:
      path: Tally/Resources/Info.plist
    entitlements:
      path: FullSigning/TallyAppDB.entitlements
    dependencies:
      - target: TallyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samua.tally
        PRODUCT_NAME: Tally
        INFOPLIST_FILE: Tally/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "23"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CODE_SIGN_ENTITLEMENTS: FullSigning/TallyAppDB.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited) -D TALLY_APPDB_EXTENSIONS"
    scheme:
      testTargets:
        - TallyTests
        - TallyUITests

  TallyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FullSigning/Shared
      - path: FullSigning/TallyWidgets
    info:
      path: FullSigning/TallyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Tally Widgets
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "23"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: FullSigning/TallyWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samua.tally.widgets
        PRODUCT_NAME: TallyWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: FullSigning/TallyWidgets.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited) -D TALLY_APPDB_EXTENSIONS -D TALLY_WIDGET_EXTENSION"

  TallyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TallyTests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samua.tally.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tally.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Tally"
        BUNDLE_LOADER: "$(TEST_HOST)"

  TallyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TallyUITests
    dependencies:
      - target: Tally
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samua.tally.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tally
