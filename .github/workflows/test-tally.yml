name: Validate Tally 2.0 Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Tally/**'
      - 'TallyTests/**'
      - 'TallyUITests/**'
      - 'project.yml'
      - '.github/workflows/test-tally.yml'

jobs:
  validate-tests:
    name: Compile unit and UI tests
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '(!F)') }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate icon resources
        run: |
          swift Scripts/generate_icons.swift

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Build application and tests for simulator
        shell: bash
        run: |
          set +e
          xcodebuild \
            -project Tally.xcodeproj \
            -scheme Tally \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing > test-build.log 2>&1
          status=$?
          grep -E "(^|[[:space:]])(error:|warning:)|BUILD FAILED|The following build commands failed" test-build.log > test-compiler-diagnostics.txt || true
          if [ "$status" -ne 0 ]; then
            cat test-compiler-diagnostics.txt
            tail -n 160 test-build.log
            exit "$status"
          fi
          echo "Tally application, unit tests, and UI tests compiled successfully."

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tally_2_0_test_diagnostics
          path: |
            test-build.log
            test-compiler-diagnostics.txt
          if-no-files-found: warn
          retention-days: 7
