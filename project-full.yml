name: TallyFull
options:
  bundleIdPrefix: com.samua
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0

targets:
  Tally:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tally
        excludes:
          - RootView.swift
          - Resources/Info.plist
          - Resources/Assets.xcassets
          - Resources/AlternateIcons
      - path: FullSigning/Shared
      - path: FullSigning/App
    resources:
      - path: Tally/Resources
    info:
      path: Tally/Resources/Info.plist
      properties:
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: FullSigning/Tally.entitlements
    dependencies:
      - target: TallyWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samua.tally
        PRODUCT_NAME: Tally
        INFOPLIST_FILE: Tally/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "20"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        CODE_SIGN_ENTITLEMENTS: FullSigning/Tally.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited) -D TALLY_FULL_SIGNING"
    scheme:
      testTargets: []

  TallyWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FullSigning/Shared
      - path: FullSigning/TallyWidgets
    info:
      path: FullSigning/TallyWidgets-Info.plist
      properties:
        CFBundleDisplayName: Tally Widgets
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "20"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    entitlements:
      path: FullSigning/TallyWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samua.tally.widgets
        PRODUCT_NAME: TallyWidgets
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: FullSigning/TallyWidgets.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited) -D TALLY_FULL_SIGNING"
